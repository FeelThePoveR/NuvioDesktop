# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
script:
  # Workaround for error in Github Actions (https://github.com/AppImageCrafters/appimage-builder/issues/271)
  - which mksquashfs || apt install squashfs-tools
  - 'echo "Recipe working dir: $(pwd)"'
  - 'echo "Expected AppDir: ./AppDir"'
  - ls -la
  - 'ls -la ./AppDir || echo "AppDir is missing"'
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
  - 'test -f AppDir/Nuvio.png && cp AppDir/Nuvio.png AppDir/usr/share/icons/hicolor/256x256/apps/Nuvio.png || echo "Nuvio icon missing in AppDir"'

AppDir:
  path: ./AppDir
  app_info:
    id: com.nuvio.media.desktop
    name: Nuvio
    icon: Nuvio
    version: 0.0.0
    exec: bin/Nuvio
    exec_args: $@
  apt:
    arch:
      - amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main universe
    include:
      - libmpv2
      - libwebkit2gtk-4.1-0
      - libsecret-1-0
      - libglib2.0-0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxau6
      - libxdamage1
      - libxfixes3
      - libxrender1
      - libxrandr2
      - libxinerama1
      - libxss1
      - libxcursor1
      - libxi6
      - libxtst6
      - libxxf86vm1
      - libxcb-shm0
      - libxcb-render0
      - libxcb-shape0
      - libxcb-randr0
      - libxcb-xfixes0
      - libxcb-present0
      - libxcb-dri3-0
      - libxcb-glx0
      - libxcb-sync1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libdrm2
      - libgbm1
      - libexpat1
      - zlib1g
      - libgmp10
      - libusb-1.0-0
      - libjack-jackd2-0
      - libpipewire-0.3-0
      - libgtk-3-0
      - libgdk-pixbuf-2.0-0
      - libcairo2
      - libpango-1.0-0
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libgraphene-1.0-0
      - libepoxy0
      - libfribidi0
      - libharfbuzz0b
      - libsoup-3.0-0
      - libgstreamer-plugins-base1.0-0
      - libxcomposite1
      - libxext6
      - gstreamer1.0-plugins-base
      - gstreamer1.0-0
      - gstreamer1.0-gl
      - gstreamer1.0-plugins-good
      - gstreamer1.0-libav
      - glib-networking

  after_bundle:
    # Patch webkit so it stops referencing host libs and uses the bundled ones instead
    - find './AppDir/usr/lib/x86_64-linux-gnu/' -name 'libwebkit2gtk-4.1*' -exec sed -i -e "s|/usr|./usr|g" '{}' \;
  runtime:
    env:
      # Keep runtime resolution deterministic inside AppDir and disable AppRun preload hooks for JVM/JNI.
      LD_PRELOAD: ''
      LD_LIBRARY_PATH: '${APPDIR}/lib:${APPDIR}/lib/x86_64-linux-gnu:${APPDIR}/usr/lib:${APPDIR}/usr/lib/x86_64-linux-gnu:${APPDIR}/lib/runtime/lib:${APPDIR}/lib/app'
      PATH: '${APPDIR}/usr/bin:${APPDIR}/bin'
      XDG_DATA_DIRS: '${APPDIR}/usr/share/:/usr/local/share/:/usr/share/:${XDG_DATA_DIRS}'
  files:
    include: []
    exclude: 
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
      # Additional host-provided libs (from curated exclusion list in pkg2appimage repo)
      - usr/lib/x86_64-linux-gnu/libc.so.*
      - usr/lib/x86_64-linux-gnu/libld-linux-x86-64.so.*
      - usr/lib/x86_64-linux-gnu/libstdc++.so.*
      - usr/lib/x86_64-linux-gnu/ld-linux.so.2
      - usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
      - usr/lib/x86_64-linux-gnu/libanl.so.1
      - usr/lib/x86_64-linux-gnu/libBrokenLocale.so.1
      - usr/lib/x86_64-linux-gnu/libcidn.so.1
      - usr/lib/x86_64-linux-gnu/libc.so.6
      - usr/lib/x86_64-linux-gnu/libdl.so.2
      - usr/lib/x86_64-linux-gnu/libm.so.6
      - usr/lib/x86_64-linux-gnu/libmvec.so.1
      - usr/lib/x86_64-linux-gnu/libnss_compat.so.2
      - usr/lib/x86_64-linux-gnu/libnss_dns.so.2
      - usr/lib/x86_64-linux-gnu/libnss_files.so.2
      - usr/lib/x86_64-linux-gnu/libnss_hesiod.so.2
      - usr/lib/x86_64-linux-gnu/libnss_nisplus.so.2
      - usr/lib/x86_64-linux-gnu/libnss_nis.so.2
      - usr/lib/x86_64-linux-gnu/libpthread.so.0
      - usr/lib/x86_64-linux-gnu/libresolv.so.2
      - usr/lib/x86_64-linux-gnu/librt.so.1
      - usr/lib/x86_64-linux-gnu/libthread_db.so.1
      - usr/lib/x86_64-linux-gnu/libutil.so.1
      - usr/lib/x86_64-linux-gnu/libstdc++.so.6
      - usr/lib/x86_64-linux-gnu/libgcc_s.so.1
      - usr/lib/x86_64-linux-gnu/libgpg-error.so.0
      - usr/lib/x86_64-linux-gnu/libICE.so.6
      - usr/lib/x86_64-linux-gnu/libSM.so.6
      - usr/lib/x86_64-linux-gnu/libuuid.so.1
      - usr/lib/x86_64-linux-gnu/libwayland-server.so.0
      - usr/lib/x86_64-linux-gnu/libxcb-dri2.so.0
AppImage:
  arch: x86_64
  file_name: Nuvio-Linux-x86_64-${APP_VERSION}.AppImage
  update-information: gh-releases-zsync|NuvioMedia|NuvioDesktop|latest|Nuvio-Linux-x86_64-*.AppImage.zsync